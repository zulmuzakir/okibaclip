name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go tool mygo vet .
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Cross-build
        if: runner.os == 'Linux'
        run: go tool mygo build -platform linux/amd64,windows/amd64,darwin/arm64 -skip-installer
